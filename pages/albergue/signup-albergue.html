<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Crear cuenta de albergue — Huelli MVP." />
  <title>Crea tu cuenta · Albergue · Huelli MVP</title>
  <link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../css/mvp.css?v=hero-cta" />
</head>
<body class="font-sans mvp-app mvp-login mvp-signup">
  <div class="mvp-shell mvp-shell--sheet">
    <p id="liveStatus" class="mvp-live-status" aria-live="polite" aria-atomic="true"></p>

    <header class="mvp-sheet-header mvp-login-hero">
      <div class="mvp-login-hero-inner">
        <div class="mvp-login-hero-badge">
          <img class="mvp-login-logo" src="../../assets/huelli-logo.jpg" alt="Huelli" />
        </div>
      </div>
    </header>

    <section class="mvp-sheet mvp-login-sheet">
      <div class="mvp-login-welcome">
        <h1 class="mvp-login-welcome-title">Crea tu cuenta</h1>
        <p class="mvp-login-welcome-sub">en Huelli para albergues</p>
      </div>

      <form id="signupForm" class="huelli-form mvp-sheet-form mvp-login-form" novalidate>
        <div class="form-field mvp-form-field mvp-login-field">
          <label class="form-label" for="nombreRep">Nombre completo del representante</label>
          <div class="mvp-outline-field mvp-outline-field--static">
            <input id="nombreRep" class="dash-input mvp-login-input" type="text" autocomplete="name" placeholder="Nombre y apellido" />
            <span class="mvp-field-icon mvp-field-icon--user" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="8" r="3.25"/>
                <path d="M5.5 19.5c1.1-3.2 3.2-4.5 6.5-4.5s5.4 1.3 6.5 4.5"/>
              </svg>
            </span>
          </div>
          <p class="field-error" data-error-for="nombreRep" hidden></p>
        </div>

        <div class="form-field mvp-form-field mvp-login-field">
          <label class="form-label" for="correo">Correo del representante</label>
          <div class="mvp-outline-field mvp-outline-field--static">
            <input id="correo" class="dash-input mvp-login-input" type="email" autocomplete="email" placeholder="Ingresa tu correo" />
            <span class="mvp-field-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3.5" y="5.5" width="17" height="13" rx="2"/>
                <path d="m4 7 8 6 8-6"/>
              </svg>
            </span>
          </div>
          <p class="field-error" data-error-for="correo" hidden></p>
        </div>

        <div class="form-field mvp-form-field mvp-login-field">
          <label class="form-label" for="contrasena">Contraseña (Mínimo 8 carácteres)</label>
          <div class="mvp-outline-field mvp-outline-field--static">
            <input id="contrasena" class="dash-input mvp-login-input mvp-input-password" type="password" autocomplete="new-password" placeholder="Ingresa tu contraseña" />
            <span class="mvp-field-icon mvp-field-icon--lock" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <rect x="5" y="11" width="14" height="10" rx="2.5"/>
                <path d="M8 11V8a4 4 0 0 1 8 0v3"/>
              </svg>
            </span>
          </div>
          <p class="field-error" data-error-for="contrasena" hidden></p>
        </div>

        <div class="form-field mvp-form-field mvp-login-field">
          <label class="form-label" for="confirma">Confirma tu contraseña</label>
          <div class="mvp-outline-field mvp-outline-field--static">
            <input id="confirma" class="dash-input mvp-login-input mvp-input-password" type="password" autocomplete="new-password" placeholder="Repite tu contraseña" />
            <span class="mvp-field-icon mvp-field-icon--lock" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <rect x="5" y="11" width="14" height="10" rx="2.5"/>
                <path d="M8 11V8a4 4 0 0 1 8 0v3"/>
              </svg>
            </span>
          </div>
          <p class="field-error" data-error-for="confirma" hidden></p>
        </div>

        <button id="signupSubmit" type="submit" class="huelli-button mvp-submit mvp-touch-target" aria-busy="false">
          <span class="mvp-submit-label">Crear cuenta</span>
        </button>
      </form>

      <p class="mvp-login-help">
        ¿Ya tienes cuenta?
        <a href="login-albergue.html">Ingresa</a>
      </p>
    </section>
  </div>

  <script src="../../js/mvp-shared.js"></script>
  <script src="../../js/auth-albergue.js"></script>
</body>
</html>
